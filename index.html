<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TTC8QGSR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'GTM-TTC8QGSR');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheepa Library — Tủ Sách Tự Dịch</title>
  <meta name="description" content="Thư viện sách dịch tối giản, thanh lịch. Đọc trực tuyến và tải về miễn phí các tác phẩm văn học, triết lý kinh điển.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="public/assets/cuu-logo.png">

  <!-- Google Fonts: Inter & Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Main Stylesheet (v10: Harmonious Cover & Locked 4-Col Specs Grid) -->
  <link rel="stylesheet" href="src/css/style.css?v=37">
</head>
<body>

  <!-- Sticky Site Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="#/" class="brand-link">
        <img src="public/assets/cuu-logo.png" alt="Sheepa Logo" class="brand-logo" onerror="this.src='public/icons/01_sheep_reading.png'">
        <div class="brand-text">
          <span class="brand-title">Sheepa Library</span>
          <span class="brand-subtitle">Tủ Sách Tự Dịch</span>
        </div>
      </a>

      <div class="nav-actions">
        <!-- Genre Tags Filter Dropdown -->
        <div class="header-filter-wrapper" title="Lọc theo thể loại">
          <img src="public/icons/glyph_13_book_ribbon.png" alt="Thể loại" class="header-filter-icon">
          <select id="header-tag-filter" class="header-filter-select" aria-label="Lọc theo thể loại">
            <option value="all">Tất cả thể loại</option>
          </select>
        </div>

        <!-- Status Filter Dropdown -->
        <div class="header-filter-wrapper" title="Lọc theo trạng thái">
          <img src="public/icons/glyph_09_quill_inkwell.png" alt="Trạng thái" class="header-filter-icon">
          <select id="header-status-filter" class="header-filter-select" aria-label="Lọc theo trạng thái">
            <option value="all">Tất cả trạng thái</option>
            <option value="completed">Hoàn thành</option>
            <option value="ongoing">Đang dịch</option>
            <option value="new">Dự án mới</option>
          </select>
        </div>


        <!-- View Mode Switcher Button (Grid / List) -->
        <button id="header-view-toggle-btn" class="header-icon-btn" aria-label="Chuyển chế độ xem" title="Chuyển sang chế độ Danh sách">
          <img id="header-view-toggle-icon" src="public/icons/glyph_12_sheep_book_lines.png" alt="Chế độ xem" class="header-btn-icon">
        </button>

        <!-- Theme Switcher (Light / Sepia / Dark) -->
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Đổi giao diện Sáng / Giấy Cũ / Tối" title="Đổi giao diện">
          <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Dynamic Application Container -->
  <div id="app">
    <!-- Populated by src/js/app.js based on URL Hash -->
  </div>

  <!-- Minimalist Site Footer with Telegram Contact & QR -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-contact">
        <a href="https://t.me/thesheepa" target="_blank" rel="noopener noreferrer" class="footer-qr-link" title="Quét mã QR hoặc bấm để vào kênh Telegram @thesheepa">
          <img src="public/assets/telegram-qr.jpg" alt="Telegram QR @thesheepa" class="footer-qr-img">
        </a>
        <div class="footer-contact-info">
          <a href="https://t.me/thesheepa" target="_blank" rel="noopener noreferrer" class="footer-telegram-link">
            <svg class="telegram-icon" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
            </svg>
            <span>t.me/thesheepa</span>
          </a>
          <span class="footer-contact-sub">Liên hệ với Sheepa qua Telegram</span>
        </div>
      </div>
      <p class="footer-copyright">© Sheepa Library — Dự án dịch thuật và chia sẻ ebook phi lợi nhuận.</p>
    </div>
  </footer>

  <!-- Application Script -->
  <script src="src/js/app.js?v=37"></script>
</body>
</html>
