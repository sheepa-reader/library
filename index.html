<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TTC8QGSR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'GTM-TTC8QGSR');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheepa Library — Tủ Sách Tự Dịch</title>
  <meta name="description" content="Thư viện sách dịch tối giản, thanh lịch. Đọc trực tuyến và tải về miễn phí các tác phẩm văn học, triết lý kinh điển.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="public/assets/cuu-logo.png">

  <!-- Google Fonts: Inter & Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Main Stylesheet (v10: Harmonious Cover & Locked 4-Col Specs Grid) -->
  <link rel="stylesheet" href="src/css/style.css?v=47">
</head>
<body>

  <!-- Sticky Site Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="#/" class="brand-link">
        <img src="public/assets/cuu-logo.png" alt="Sheepa Logo" class="brand-logo" onerror="this.src='public/icons/01_sheep_reading.png'">
        <div class="brand-text">
          <span class="brand-title">Sheepa Library</span>
          <span class="brand-subtitle">Tủ Sách Tự Dịch</span>
        </div>
      </a>

      <div class="nav-actions">
        <!-- Genre Tags Filter Dropdown -->
        <div class="header-filter-wrapper" title="Lọc theo thể loại">
          <img src="public/icons/glyph_13_book_ribbon.png" alt="Thể loại" class="header-filter-icon">
          <span id="header-tag-filter-label" class="header-filter-label">Thể loại</span>
          <svg class="header-filter-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none">
            <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <select id="header-tag-filter" class="header-filter-select" aria-label="Lọc theo thể loại">
            <option value="all">Tất cả</option>
          </select>
        </div>

        <!-- Translation Progress Button -->
        <button id="header-progress-btn" class="header-action-pill-btn" aria-label="Tiến độ dịch & Kế hoạch sách" title="Xem tiến độ dịch thuật & kế hoạch sách mới">
          <img src="public/icons/glyph_sheep_desk_lamp.png" alt="Tiến độ" class="header-action-pill-icon" onerror="this.src='public/icons/09_quill_inkwell.png'">
          <span class="header-action-pill-label">Tiến độ</span>
        </button>

        <!-- Book Translation Poll / Wishlist Button -->
        <button id="header-poll-btn" class="header-icon-btn header-poll-btn" aria-label="Bình chọn sách dịch" title="Bình chọn cuốn sách dịch tiếp theo & Gửi đề xuất">
          <img src="public/icons/glyph_sheep_lightbulb_idea.png" alt="Bình chọn" class="header-btn-icon">
        </button>

        <!-- Changelog / Update History Button -->
        <button id="header-changelog-btn" class="header-icon-btn header-changelog-btn" aria-label="Nhật ký cập nhật" title="Nhật ký cập nhật nội dung (3 ngày gần nhất)">
          <img src="public/icons/glyph_11_sheep_pen_write.png" alt="Nhật ký" class="header-btn-icon">
          <span id="header-changelog-badge" class="header-changelog-badge" style="display: none;"></span>
        </button>

        <!-- View Mode Switcher Button (Grid / List) -->
        <button id="header-view-toggle-btn" class="header-icon-btn" aria-label="Chuyển chế độ xem" title="Chuyển sang chế độ Danh sách">
          <img id="header-view-toggle-icon" src="public/icons/glyph_12_sheep_book_lines.png" alt="Chế độ xem" class="header-btn-icon">
        </button>

        <!-- Theme Switcher (Light / Sepia / Dark) -->
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Đổi giao diện Sáng / Giấy Cũ / Tối" title="Đổi giao diện">
          <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Dynamic Application Container -->
  <div id="app">
    <!-- Populated by src/js/app.js based on URL Hash -->
  </div>

  <!-- Minimalist Site Footer with Telegram Contact & QR -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-contact">
        <div class="footer-channels">
          <!-- Telegram Channel -->
          <div class="footer-channel-item">
            <a href="https://t.me/thesheepa" target="_blank" rel="noopener noreferrer" class="footer-qr-link" title="Quét mã QR hoặc bấm để vào kênh Telegram @thesheepa">
              <img src="public/assets/telegram-qr.jpg" alt="Telegram QR @thesheepa" class="footer-qr-img">
            </a>
            <a href="https://t.me/thesheepa" target="_blank" rel="noopener noreferrer" class="footer-channel-link footer-telegram-link" title="Kênh Telegram Sheepa">
              <svg class="channel-icon telegram-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
              </svg>
              <span>t.me/thesheepa</span>
            </a>
          </div>

          <div class="footer-channels-divider" aria-hidden="true"></div>

          <!-- Facebook Channel -->
          <div class="footer-channel-item">
            <a href="https://www.facebook.com/apeehseht/" target="_blank" rel="noopener noreferrer" class="footer-qr-link" title="Quét mã QR hoặc bấm để vào trang Facebook @apeehseht">
              <img src="public/assets/facebook-qr.jpg" alt="Facebook QR @apeehseht" class="footer-qr-img">
            </a>
            <a href="https://www.facebook.com/apeehseht/" target="_blank" rel="noopener noreferrer" class="footer-channel-link footer-facebook-link" title="Trang Facebook Sheepa">
              <svg class="channel-icon facebook-icon" viewBox="0 0 24 24">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              <span>fb.com/apeehseht</span>
            </a>
          </div>
        </div>
        <span class="footer-contact-sub">Liên hệ với Sheepa qua Telegram hoặc Facebook</span>
      </div>

      <!-- Live Community & Daily Stats Counter -->
      <div class="footer-stats" id="footer-stats">
        <span class="footer-stat-item footer-stat-online" title="Số bạn đọc đang trực tuyến">
          <span class="stat-pulse-dot" aria-hidden="true"></span>
          <span class="stat-num" id="stat-online-count">--</span> bạn đang đọc
        </span>
        <span class="footer-stat-sep" aria-hidden="true">•</span>
        <span class="footer-stat-item footer-stat-daily" title="Số lượt ghé thăm thư viện hôm nay">
          <svg class="stat-icon-book" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <span class="stat-num" id="stat-daily-count">--</span> lượt ghé thăm hôm nay
        </span>
      </div>

      <p class="footer-copyright">© Sheepa Library — Dự án dịch thuật và chia sẻ ebook phi lợi nhuận.</p>
    </div>
  </footer>

  <!-- Application Script -->
  <script src="src/js/app.js?v=56"></script>
</body>
</html>
